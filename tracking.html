<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102d3b">
<title>پیگیری سفارش | ماردیس‌شاپ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{font-family:'Vazirmatn',Tahoma,sans-serif;color:#193442;background:#f2f6f5;--navy:#102d3b;--teal:#087f78;--gold:#e8b85c;--muted:#71818b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#dceee8,transparent 35%),linear-gradient(135deg,#f5f8f7,#e8f0ef)}
.panel{width:min(680px,100%);background:linear-gradient(135deg,#174e55,#103c49);border:1px solid #d8f2e755;border-radius:22px;padding:clamp(20px,5vw,34px);box-shadow:0 18px 48px #071d2630;color:#fff}
.brand{font-weight:900;letter-spacing:2px;color:#f6d58e;font-size:13px;margin-bottom:18px}.brand span{color:#fff;letter-spacing:0}
h1{font-size:clamp(23px,4vw,30px);color:#ffda8a;margin:0 0 8px} .intro{line-height:2;color:#e1efed;font-size:14px;margin:0 0 22px}
label{display:block;color:#fff;font-weight:700;font-size:13px;margin-bottom:12px}
input{display:block;width:100%;margin-top:7px;padding:13px 14px;border:1px solid #d9e5e2;border-radius:11px;background:#fff;color:#17344a;font:inherit;direction:ltr;text-align:left;outline:none}
input:focus{border-color:#e8b85c;box-shadow:0 0 0 3px #e8b85c33}
button{width:100%;padding:13px;margin-top:6px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffda8a,#e8b85c);color:#17344a;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.message{min-height:24px;margin:12px 0 0;font-size:13px;line-height:1.9;color:#fff}.message.error{color:#ffd5d5}.message.success{color:#baf4dc}
.result{margin-top:18px;padding:17px;border-radius:13px;background:#fff;color:#17344a;line-height:2;overflow-wrap:anywhere}
.result h2{font-size:19px;margin:0 0 10px;color:#087f78}.result p{margin:6px 0;border-bottom:1px solid #edf1ef;padding-bottom:6px}.result p:last-child{border:0}
.hidden{display:none!important}.back{display:inline-block;margin-top:20px;color:#f6d58e;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
@media(min-width:560px){.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
</style>
</head>
<body>
<main class="panel">
  <div class="brand">MARDIS <span>SHOP</span></div>
  <h1>پیگیری سفارش</h1>
  <p class="intro">برای مشاهده وضعیت سفارش، شناسه سفارش درج‌شده در رسید و شماره موبایلی را که هنگام خرید ثبت کرده‌اید وارد کنید.</p>
  <form id="orderTrackingForm" novalidate>
    <div class="fields">
      <label>شماره سفارش
        <input id="trackingOrderId" type="text" maxlength="36" placeholder="شناسه کامل سفارش" autocomplete="off" required>
      </label>
      <label>شماره موبایل ثبت‌شده
        <input id="trackingPhone" type="tel" maxlength="30" placeholder="09xxxxxxxxx" autocomplete="tel" required>
      </label>
    </div>
    <button id="trackOrderButton" type="submit">استعلام سفارش</button>
    <p id="trackingLookupMessage" class="message" aria-live="polite"></p>
  </form>
  <section id="trackingLookupResult" class="result hidden" aria-live="polite"></section>
  <a class="back" href="https://mardisshop.ir">بازگشت به فروشگاه ←</a>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const form = $('orderTrackingForm');
  const button = $('trackOrderButton');
  const message = $('trackingLookupMessage');
  const resultBox = $('trackingLookupResult');
  let supabaseClient = null;

  const normalizeDigits = value => String(value ?? '')
    .replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))
    .replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  const safe = value => String(value ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = value => Number(value || 0).toLocaleString('fa-IR') + ' تومان';
  const statusLabels = {
    pending:'در انتظار بررسی', confirmed:'تأیید شده',
    processing:'در حال آماده‌سازی', shipped:'ارسال شده',
    delivered:'تحویل داده شده', cancelled:'لغو شده'
  };
  const paymentLabels = {
    unpaid:'پرداخت‌نشده', pending_review:'در انتظار بررسی پرداخت',
    paid:'پرداخت تأیید شده', rejected:'پرداخت تأیید نشده'
  };
  function showMessage(text, kind='') {
    message.textContent = text;
    message.className = 'message' + (kind ? ' ' + kind : '');
  }
  function toDate(value) {
    if (!value) return '';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('fa-IR');
  }
  function renderOrder(data) {
    const status = statusLabels[data.status] || 'در حال بررسی';
    const payment = paymentLabels[data.payment_status];
    const shippedDate = toDate(data.shipped_at);
    const createdDate = toDate(data.created_at);
    const rows = [
      `<p><b>شماره سفارش:</b> <span dir="ltr">${safe(data.order_id || data.id)}</span></p>`,
      `<p><b>وضعیت سفارش:</b> ${safe(status)}</p>`,
      payment ? `<p><b>وضعیت پرداخت:</b> ${safe(payment)}</p>` : '',
      `<p><b>مبلغ سفارش:</b> ${money(data.total_amount)}</p>`,
      `<p><b>کد رهگیری مرسوله:</b> ${data.tracking_number ? `<strong dir="ltr">${safe(data.tracking_number)}</strong>` : 'هنوز ثبت نشده است.'}</p>`,
      shippedDate ? `<p><b>تاریخ ارسال:</b> ${safe(shippedDate)}</p>` : '',
      createdDate ? `<p><b>تاریخ ثبت سفارش:</b> ${safe(createdDate)}</p>` : '',
      data.status === 'shipped' && data.tracking_number ? '<p>کد رهگیری را می‌توانید در سامانه شرکت حمل‌ونقل مربوط وارد کنید.</p>' : ''
    ].filter(Boolean).join('');
    resultBox.innerHTML = `<h2>نتیجه پیگیری سفارش</h2>${rows}`;
    resultBox.classList.remove('hidden');
  }

  // Bind immediately so a failed network import can never cause a form page refresh.
  form.addEventListener('submit', async event => {
    event.preventDefault();
    resultBox.classList.add('hidden');
    resultBox.textContent = '';

    const orderId = $('trackingOrderId').value.trim();
    const phone = normalizeDigits($('trackingPhone').value).replace(/[^0-9]/g, '');
    const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
    if (!uuidPattern.test(orderId)) {
      showMessage('شناسه کامل سفارش معتبر نیست. شناسه درج‌شده در رسید را عیناً وارد کنید.', 'error');
      return;
    }
    if (phone.length < 8) {
      showMessage('شماره موبایل را بررسی کنید.', 'error');
      return;
    }

    button.disabled = true;
    button.textContent = 'در حال جستجو…';
    showMessage('در حال دریافت وضعیت سفارش…');

    try {
      if (!supabaseClient) {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        supabaseClient = createClient(
          'https://snkdwaatcjmqdhkxiasa.supabase.co',
          'sb_publishable_5o05x-xTjWYSTGXDBdE-Ug_jwZwASAI'
        );
      }
      const { data, error } = await supabaseClient.rpc('customer_track_order', {
        p_order_id: orderId,
        p_phone: phone
      });
      if (error) throw error;
      const record = Array.isArray(data) ? data[0] : data;
      if (!record || record.success !== true) {
        showMessage(record?.error || 'سفارشی با این اطلاعات پیدا نشد. شماره سفارش و موبایل را بررسی کنید.', 'error');
        return;
      }
      renderOrder(record);
      showMessage('اطلاعات سفارش با موفقیت دریافت شد.', 'success');
    } catch (error) {
      showMessage('دریافت اطلاعات انجام نشد. اتصال اینترنت را بررسی کنید و در صورت تکرار خطا، تنظیمات تابع پیگیری در Supabase باید بررسی شود. ' + (error?.message || ''), 'error');
    } finally {
      button.disabled = false;
      button.textContent = 'استعلام سفارش';
    }
  });
})();
</script>
</body>
</html>
